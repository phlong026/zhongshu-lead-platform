services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhongshu}
      POSTGRES_USER: ${POSTGRES_USER:-zhongshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhongshu} -d ${POSTGRES_DB:-zhongshu}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command:
      - uvicorn
      - apps.api.src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --no-access-log
      - --workers
      - "${WEB_CONCURRENCY:-1}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhongshu}
      POSTGRES_USER: ${POSTGRES_USER:-zhongshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      SYNC_THREADPOOL_TOKENS: ${SYNC_THREADPOOL_TOKENS:-40}
      MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-32}
      IN_FLIGHT_QUEUE_TIMEOUT_SECONDS: ${IN_FLIGHT_QUEUE_TIMEOUT_SECONDS:-10}
      OBJECT_STORAGE_DIR: /app/storage
    volumes:
      - private_storage:/app/storage

  scheduler:
    build: .
    restart: unless-stopped
    entrypoint: ["/app/docker/scheduler-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhongshu}
      POSTGRES_USER: ${POSTGRES_USER:-zhongshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      DATABASE_POOL_SIZE: ${SCHEDULER_DATABASE_POOL_SIZE:-2}
      DATABASE_MAX_OVERFLOW: ${SCHEDULER_DATABASE_MAX_OVERFLOW:-2}
      DATABASE_POOL_TIMEOUT_SECONDS: ${SCHEDULER_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      WEB_CONCURRENCY: "1"
      SYNC_THREADPOOL_TOKENS: ${SCHEDULER_SYNC_THREADPOOL_TOKENS:-4}
      MAX_IN_FLIGHT_REQUESTS: "4"
      IN_FLIGHT_QUEUE_TIMEOUT_SECONDS: "10"
      OBJECT_STORAGE_DIR: /app/storage
      SCHEDULER_HEARTBEAT_FILE: /tmp/zhongshu-scheduler-heartbeat
      SCHEDULER_HEARTBEAT_MAX_AGE_SECONDS: "90"
    volumes:
      - private_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; from pathlib import Path; p=Path(os.environ['SCHEDULER_HEARTBEAT_FILE']); age=time.time()-p.stat().st_mtime if p.is_file() else -1; raise SystemExit(0 if 0 <= age <= float(os.environ['SCHEDULER_HEARTBEAT_MAX_AGE_SECONDS']) else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s

  lead-export-worker:
    build: .
    restart: unless-stopped
    entrypoint: ["/app/docker/lead-export-worker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhongshu}
      POSTGRES_USER: ${POSTGRES_USER:-zhongshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      DATABASE_POOL_SIZE: ${LEAD_EXPORT_DATABASE_POOL_SIZE:-2}
      DATABASE_MAX_OVERFLOW: ${LEAD_EXPORT_DATABASE_MAX_OVERFLOW:-0}
      DATABASE_POOL_TIMEOUT_SECONDS: ${LEAD_EXPORT_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      OBJECT_STORAGE_DIR: /app/storage
      LEAD_EXPORT_POLL_SECONDS: ${LEAD_EXPORT_POLL_SECONDS:-5}
      LEAD_EXPORT_HEARTBEAT_FILE: /tmp/zhongshu-lead-export-heartbeat
      LEAD_EXPORT_HEARTBEAT_MAX_AGE_SECONDS: "90"
    volumes:
      - private_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; from pathlib import Path; p=Path(os.environ['LEAD_EXPORT_HEARTBEAT_FILE']); age=time.time()-p.stat().st_mtime if p.is_file() else -1; raise SystemExit(0 if 0 <= age <= float(os.environ['LEAD_EXPORT_HEARTBEAT_MAX_AGE_SECONDS']) else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # The gateway is only for local development or a host reverse proxy.
      # Do not expose the container directly on every network interface.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      # The official entrypoint renders templates into conf.d.  Mounting the
      # source there makes production envsubst fail on a read-only file.
      - ./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  postgres_data:
  private_storage:
