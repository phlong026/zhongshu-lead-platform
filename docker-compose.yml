services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhongshu}
      POSTGRES_USER: ${POSTGRES_USER:-zhongshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhongshu} -d ${POSTGRES_DB:-zhongshu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.2.0}
        APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhongshu}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-zhongshu}
    volumes:
      - private_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8

  scheduler:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.2.0}
        APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhongshu}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-zhongshu}
      SCHEDULER_HEARTBEAT_FILE: /tmp/zhongshu-scheduler/heartbeat
    entrypoint: ["/app/docker/scheduler-entrypoint.sh"]
    volumes:
      - private_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,time; p=os.environ.get('SCHEDULER_HEARTBEAT_FILE','/tmp/zhongshu-scheduler/heartbeat'); sys.exit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p) < 180 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  private_storage:
