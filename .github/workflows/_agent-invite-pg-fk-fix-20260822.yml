name: One-shot Invite PostgreSQL FK Fix

on:
  push:
    branches: [feat/invite-binding-complete]
    paths:
      - scripts/_agent_invite_pg_fk_fix_20260822.py
      - .github/workflows/_agent-invite-pg-fk-fix-20260822.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-invite-pg-fk-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_invite_ci
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: invite-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_invite_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://zhongshu:invite-ci-password@127.0.0.1:5432/zhongshu_invite_ci
      INVITE_POSTGRES_TEST_URL: postgresql+psycopg://zhongshu:invite-ci-password@127.0.0.1:5432/zhongshu_invite_ci
      FIELD_ENCRYPTION_KEY: invite-ci-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: invite-ci-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: invite-ci-phone-fingerprint-secret-at-least-32-characters
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feat/invite-binding-complete
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Apply foreign-key ordering fix
        run: python scripts/_agent_invite_pg_fk_fix_20260822.py

      - name: Verify SQLite regression
        run: python -m pytest apps/api/tests/test_auth_company.py apps/api/tests/test_invite_binding_security.py -q

      - name: Create PostgreSQL schema and run concurrency proof
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m pytest apps/api/tests/test_invite_postgres_concurrency.py -q

      - name: Remove one-shot assets and commit
        run: |
          rm -f scripts/_agent_invite_pg_fk_fix_20260822.py
          rm -f .github/workflows/_agent-invite-pg-fk-fix-20260822.yml
          git diff --check
          git config user.name "荣赫智能"
          git config user.email "peihr66@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "修复 PostgreSQL 主账号外键占用顺序

在同一事务中先落候选用户，再通过条件更新原子占用 company.primary_user_id；冲突和后续异常均整体回滚，避免写入不存在的外键目标。

Constraint: 保留公司主账号唯一保护与事务回滚
Confidence: high
Scope-risk: narrow
Reversibility: clean
Tested: SQLite 邀请回归与 PostgreSQL 并发绑定
Not-tested: 生产多进程拓扑"
            git push origin HEAD:feat/invite-binding-complete
          fi

      - name: Dispatch formal release verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main-release.yml --ref feat/invite-binding-complete -f performance_action=none
