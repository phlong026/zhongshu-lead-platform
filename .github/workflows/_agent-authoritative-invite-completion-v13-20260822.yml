name: Conditional Invite Completion V13

on:
  push:
    branches: [feat/invite-binding-complete]
    paths:
      - scripts/_agent_invite_orchestrator_v13_failure_adaptive_patch_20260822.py
      - .github/workflows/_agent-authoritative-invite-completion-v13-20260822.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: conditional-invite-v13
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-24.04
    outputs:
      repair: ${{ steps.gate.outputs.repair }}
      failed_run: ${{ steps.gate.outputs.failed_run }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feat/invite-binding-complete
          fetch-depth: 0

      - name: Wait for V12 and authorize repair only for its matching failure report
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          deadline = time.time() + 2400
          latest = None
          while time.time() < deadline:
              raw = subprocess.check_output([
                  "gh", "run", "list",
                  "--workflow", "Authoritative Invite Completion V12",
                  "--branch", "feat/invite-binding-complete",
                  "--limit", "10",
                  "--json", "databaseId,status,conclusion,createdAt",
              ], text=True)
              runs = json.loads(raw)
              if runs:
                  latest = sorted(runs, key=lambda item: item["createdAt"], reverse=True)[0]
                  if latest["status"] == "completed":
                      break
              time.sleep(30)

          repair = False
          failed_run = ""
          if latest and latest["status"] == "completed" and latest.get("conclusion") != "success":
              failed_run = str(latest["databaseId"])
              report = Path("docs/reports/INVITE-AUTHORITATIVE-FAILURE.md")
              if report.exists():
                  match = re.search(r"workflow_run:\s*(\d+)", report.read_text(encoding="utf-8", errors="replace"))
                  repair = bool(match and match.group(1) == failed_run)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"repair={'true' if repair else 'false'}\n")
              handle.write(f"failed_run={failed_run}\n")
          print(json.dumps({"latest": latest, "repair": repair, "failed_run": failed_run}, ensure_ascii=False))
          PY

  repair-and-orchestrate:
    needs: decide
    if: needs.decide.outputs.repair == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_conditional_v13
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: conditional-v13-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_conditional_v13"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GH_TOKEN: ${{ github.token }}
      INVITE_POSTGRES_TEST_URL: postgresql+psycopg://zhongshu:conditional-v13-password@127.0.0.1:5432/zhongshu_conditional_v13
      CLAIM_POSTGRES_TEST_URL: postgresql+psycopg://zhongshu:conditional-v13-password@127.0.0.1:5432/zhongshu_conditional_v13
      FIELD_ENCRYPTION_KEY: conditional-v13-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: conditional-v13-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: conditional-v13-phone-fingerprint-secret-at-least-32-characters
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feat/invite-binding-complete
          fetch-depth: 0

      - name: Cancel superseded authoritative runs
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          obsolete={
            "One-shot Invite Completion","One-shot Invite PostgreSQL FK Fix","Finalize Invite Completion",
            "Authoritative Invite Completion","Relaunch Authoritative Invite Completion",
            "Authoritative Invite Completion V2","Authoritative Invite Completion V3","Authoritative Invite Completion V4",
            "Authoritative Invite Completion V5","Authoritative Invite Completion V6","Authoritative Invite Completion V7",
            "Authoritative Invite Completion V8","Authoritative Invite Completion V9","Authoritative Invite Completion V10",
            "Authoritative Invite Completion V11","Authoritative Invite Completion V12",
          }
          runs=json.loads(subprocess.check_output(["gh","run","list","--branch","feat/invite-binding-complete","--limit","300","--json","databaseId,name,status"],text=True))
          for item in runs:
            if item["name"] in obsolete and item["status"]!="completed":
              subprocess.run(["gh","run","cancel",str(item["databaseId"])],check=False)
          PY
          git fetch origin feat/invite-binding-complete
          git reset --hard origin/feat/invite-binding-complete

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-audit.txt -r requirements-browser.txt

      - name: Restore deterministic patches, apply failure-specific adaptation and orchestrate
        shell: bash
        run: |
          restore_path(){
            local path="$1"
            [ -f "$path" ] && return 0
            mkdir -p "$(dirname "$path")"
            for commit in $(git log --all --format=%H -- "$path"); do
              if git show "$commit:$path" > "$path" 2>/dev/null; then return 0; fi
            done
            return 1
          }
          for path in \
            scripts/_agent_invite_completion_20260822.py \
            scripts/_agent_invite_pg_fk_fix_20260822.py \
            scripts/_agent_invite_authoritative_20260822.py \
            scripts/_agent_invite_authoritative_hotfix_20260822.py \
            scripts/_agent_invite_retry_fixes_20260822.py \
            scripts/_agent_invite_orchestrator_v3_20260822.py \
            scripts/_agent_invite_orchestrator_v4_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v5_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v6_admin_entry_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v7_h5_compat_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v8_admin_tag_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v9_claim_fixture_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v10_oauth_error_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v11_post_generation_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v12_adaptive_patch_20260822.py \
            scripts/_agent_invite_orchestrator_v12_hotfix_20260822.py; do
            restore_path "$path"
          done
          python scripts/_agent_invite_orchestrator_v4_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v8_admin_tag_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v6_admin_entry_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v7_h5_compat_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v9_claim_fixture_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v11_post_generation_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v12_hotfix_20260822.py
          python scripts/_agent_invite_orchestrator_v13_failure_adaptive_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v5_patch_20260822.py
          python scripts/_agent_invite_orchestrator_v3_20260822.py
