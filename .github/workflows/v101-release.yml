name: V1.0.1 CI and Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v101-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main release history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/quality dist/release
          pytest -q 2>&1 | tee dist/quality/pytest.txt
          python scripts/check_js.py 2>&1 | tee dist/quality/javascript.txt
          python scripts/secret_scan.py 2>&1 | tee dist/quality/secret-scan.txt
          python -m compileall -q apps scripts
          git diff --check
          git status --short --ignored > dist/quality/worktree-status.txt

      - name: Build exact-main V1.0.1 delivery artifacts
        run: python scripts/package_v101.py --version V1.0.1 --output-dir dist/release --quality-dir dist/quality

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import zipfile
          archives = list(Path('dist/release').glob('*完整源码.zip'))
          assert len(archives) == 1, archives
          allowed_env = {'.env.example', '.env.docker.example'}
          expected_commit = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          with zipfile.ZipFile(archives[0]) as archive:
              names = archive.namelist()
              manifests = [name for name in names if name.endswith('/RELEASE_MANIFEST.json')]
              assert len(manifests) == 1, manifests
              manifest = json.loads(archive.read(manifests[0]).decode('utf-8'))
              assert manifest['commit'] == expected_commit, (manifest['commit'], expected_commit)
              unsafe = []
              for name in names:
                  relative = name.split('/', 1)[1] if '/' in name else name
                  if relative in allowed_env:
                      continue
                  if (
                      relative == '.env'
                      or relative.startswith('.env.')
                      or '/storage/' in f'/{relative}'
                      or relative.startswith('backups/postgres/')
                      or relative.startswith('backups/private-storage/')
                      or relative.startswith('infra/certs/') and relative != 'infra/certs/README.md'
                      or relative.lower().endswith(('.pem', '.key', '.p12', '.pfx'))
                  ):
                      unsafe.append(relative)
              assert not unsafe, unsafe
          print('exact main source archive verified:', expected_commit)
          PY

      - name: Upload exact-main V1.0.1 delivery package
        uses: actions/upload-artifact@v4
        with:
          name: zhongshu-v1.0.1-final-main-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
