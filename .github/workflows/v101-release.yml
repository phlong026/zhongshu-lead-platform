name: V1.0.1 CI and Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v101-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/quality dist/release
          pytest -q 2>&1 | tee dist/quality/pytest.txt
          python scripts/check_js.py 2>&1 | tee dist/quality/javascript.txt
          python scripts/secret_scan.py 2>&1 | tee dist/quality/secret-scan.txt
          python -m compileall -q apps scripts
          git diff --check
          git status --short --ignored > dist/quality/worktree-status.txt

      - name: Build V1.0.1 delivery artifacts
        run: python scripts/package_v101.py --version V1.0.1 --output-dir dist/release --quality-dir dist/quality

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archives = list(Path('dist/release').glob('*完整源码.zip'))
          assert len(archives) == 1, archives
          with zipfile.ZipFile(archives[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith('/RELEASE_MANIFEST.json') for name in names)
              prohibited = ('/.env', '/storage/', '/backups/postgres/', '/infra/certs/fullchain.pem')
              assert not any(any(marker in name for marker in prohibited) for name in names)
          print('source archive verified')
          PY

      - name: Upload V1.0.1 delivery package
        uses: actions/upload-artifact@v4
        with:
          name: zhongshu-v1.0.1-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
