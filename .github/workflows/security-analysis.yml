name: Security Analysis

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sast-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: candidate
    env:
      APP_IMAGE: zhongshu-security:${{ github.event.pull_request.head.sha || github.sha }}
      SEMGREP_IMAGE: semgrep/semgrep@sha256:a8298d1c09c84b9a0bbc75ec915e37023fc4657360b6dbfa645261d2353a366c
      SEMGREP_RULES_COMMIT: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
      SEMGREP_RULES_DIR: /tmp/semgrep-rules
      TRIVY_IMAGE: aquasec/trivy@sha256:85e87be1a96459c38a4eea47dc64eb2d342bb14cd4b4cef96adcf6ff03378b7c
      SEMGREP_SEND_METRICS: "off"
    steps:
      - name: Checkout trusted security policy from base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate as untrusted scan input
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/requirements.txt

      - name: Fetch pinned Semgrep security rules
        shell: bash
        run: |
          mkdir -p dist/security
          rm -rf "$SEMGREP_RULES_DIR"
          git init -q "$SEMGREP_RULES_DIR"
          git -C "$SEMGREP_RULES_DIR" remote add origin https://github.com/semgrep/semgrep-rules.git
          git -C "$SEMGREP_RULES_DIR" fetch --depth=1 origin "$SEMGREP_RULES_COMMIT"
          git -C "$SEMGREP_RULES_DIR" checkout -q --detach FETCH_HEAD
          actual_commit="$(git -C "$SEMGREP_RULES_DIR" rev-parse HEAD)"
          test "$actual_commit" = "$SEMGREP_RULES_COMMIT"
          git -C "$SEMGREP_RULES_DIR" fsck --strict
          rules_tree="$(git -C "$SEMGREP_RULES_DIR" rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$actual_commit" > dist/security/semgrep-rules-commit.txt
          printf '%s\n' "$rules_tree" > dist/security/semgrep-rules-tree.txt
          for path in \
            python/lang/security \
            python/sqlalchemy/security \
            python/fastapi/security \
            python/boto3/security \
            python/cryptography/security \
            python/jwt/security \
            javascript/lang/security \
            javascript/browser/security \
            javascript/express/security \
            javascript/audit
          do
            test -d "$SEMGREP_RULES_DIR/$path"
          done

      - name: Run immutable Semgrep Python and JavaScript SAST
        shell: bash
        run: |
          mkdir -p dist/security
          : > dist/security/semgrep.json
          chmod 666 dist/security/semgrep.json
          printf '%s\n' "$SEMGREP_IMAGE" > dist/security/semgrep-image-ref.txt
          set +e
          docker pull "$SEMGREP_IMAGE" > dist/security/semgrep-pull.txt 2>&1
          pull_code=$?
          if [ "$pull_code" -eq 0 ]; then
            docker run --rm \
              -w /src \
              -e SEMGREP_SEND_METRICS=off \
              -v "$PWD:/src:ro" \
              -v "$SEMGREP_RULES_DIR:/rules:ro" \
              -v "$PWD/dist/security/semgrep.json:/tmp/semgrep.json:rw" \
              "$SEMGREP_IMAGE" semgrep scan \
              --metrics off \
              --x-ignore-semgrepignore-files \
              --config /rules/python/lang/security \
              --config /rules/python/sqlalchemy/security \
              --config /rules/python/fastapi/security \
              --config /rules/python/boto3/security \
              --config /rules/python/cryptography/security \
              --config /rules/python/jwt/security \
              --config /rules/javascript/lang/security \
              --config /rules/javascript/browser/security \
              --config /rules/javascript/express/security \
              --config /rules/javascript/audit \
              --include '*.py' \
              --include '*.js' \
              --exclude '.git' \
              --exclude 'dist' \
              --exclude 'storage' \
              --json \
              --output /tmp/semgrep.json \
              . > dist/security/semgrep-console.txt 2>&1
            scan_code=$?
            docker run --rm "$SEMGREP_IMAGE" semgrep --version \
              > dist/security/semgrep-version.txt 2>&1
            version_code=$?
          else
            scan_code="$pull_code"
            version_code="$pull_code"
            cp dist/security/semgrep-pull.txt dist/security/semgrep-console.txt
            cp dist/security/semgrep-pull.txt dist/security/semgrep-version.txt
          fi
          set -e

          if [ "$scan_code" -ne 0 ]; then
            code="$scan_code"
          elif [ "$version_code" -ne 0 ]; then
            code="$version_code"
          else
            code=0
          fi
          printf '%s\n' "$code" > dist/security/semgrep-exit-code.txt
          cat dist/security/semgrep-console.txt
          exit 0

      - name: Verify SAST tooling did not mutate checkout
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "security tooling modified tracked or non-ignored checkout content"
            exit 1
          fi

      - name: Build and freeze production image subject
        shell: bash
        run: |
          mkdir -p dist/security
          set +e
          (
            set -e
            docker build --pull --build-arg APP_VERSION=1.2.0 -t "$APP_IMAGE" .
            docker save "$APP_IMAGE" -o dist/security/app-image.tar
            image_id="$(docker image inspect "$APP_IMAGE" --format '{{.Id}}')"
            archive_sha256="$(sha256sum dist/security/app-image.tar | awk '{print $1}')"
            python - "$APP_IMAGE" "$image_id" "$archive_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          image_ref, image_id, archive_sha256 = sys.argv[1:]
          Path("dist/security/scan-subject.json").write_text(
              json.dumps(
                  {
                      "image_ref": image_ref,
                      "image_id": image_id,
                      "archive_sha256": archive_sha256,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          ) > dist/security/image-build.txt 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > dist/security/image-build-exit-code.txt
          cat dist/security/image-build.txt
          exit 0

      - name: Scan frozen image archive and generate CycloneDX SBOM
        shell: bash
        run: |
          mkdir -p dist/security
          build_code="$(cat dist/security/image-build-exit-code.txt 2>/dev/null || printf '125')"
          if [ "$build_code" != "0" ]; then
            printf '125\n' > dist/security/trivy-exit-code.txt
            printf 'production image build/freeze failed; Trivy scan skipped\n' > dist/security/trivy-console.txt
            cat dist/security/trivy-console.txt
            exit 0
          fi

          : > dist/security/trivy-image.json
          : > dist/security/sbom.cdx.json
          chmod 666 dist/security/trivy-image.json dist/security/sbom.cdx.json

          set +e
          printf '%s\n' "$TRIVY_IMAGE" > dist/security/trivy-image-ref.txt
          docker pull "$TRIVY_IMAGE" > dist/security/trivy-pull.txt 2>&1
          pull_code=$?
          if [ "$pull_code" -eq 0 ]; then
            docker run --rm \
              -v "$PWD/dist/security/app-image.tar:/tmp/app-image.tar:ro" \
              -v "$PWD/dist/security/trivy-image.json:/tmp/trivy-image.json:rw" \
              "$TRIVY_IMAGE" image \
              --input /tmp/app-image.tar \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --list-all-pkgs \
              --format json \
              --output /tmp/trivy-image.json \
              > dist/security/trivy-console.txt 2>&1
            vuln_code=$?

            docker run --rm \
              -v "$PWD/dist/security/app-image.tar:/tmp/app-image.tar:ro" \
              -v "$PWD/dist/security/sbom.cdx.json:/tmp/sbom.cdx.json:rw" \
              "$TRIVY_IMAGE" image \
              --input /tmp/app-image.tar \
              --format cyclonedx \
              --output /tmp/sbom.cdx.json \
              >> dist/security/trivy-console.txt 2>&1
            sbom_code=$?
          else
            vuln_code="$pull_code"
            sbom_code="$pull_code"
            cp dist/security/trivy-pull.txt dist/security/trivy-console.txt
          fi
          set -e

          if [ "$vuln_code" -ne 0 ]; then
            code="$vuln_code"
          elif [ "$sbom_code" -ne 0 ]; then
            code="$sbom_code"
          else
            code=0
          fi
          printf '%s\n' "$code" > dist/security/trivy-exit-code.txt
          cat dist/security/trivy-console.txt
          exit 0

      - name: Enforce SAST image vulnerability SBOM and waiver gate
        if: always()
        run: |
          python ../policy/scripts/check_security_gate.py \
            --semgrep dist/security/semgrep.json \
            --semgrep-exit dist/security/semgrep-exit-code.txt \
            --semgrep-image-ref dist/security/semgrep-image-ref.txt \
            --semgrep-version dist/security/semgrep-version.txt \
            --semgrep-rules-commit dist/security/semgrep-rules-commit.txt \
            --semgrep-rules-tree dist/security/semgrep-rules-tree.txt \
            --source-root . \
            --trivy dist/security/trivy-image.json \
            --trivy-exit dist/security/trivy-exit-code.txt \
            --sbom dist/security/sbom.cdx.json \
            --subject dist/security/scan-subject.json \
            --image-archive dist/security/app-image.tar \
            --waivers ../policy/security/waivers.json \
            --output dist/security/security-gate.json

      - name: Upload exact green scanned candidate image
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-candidate-image-${{ github.run_id }}
          path: |
            candidate/dist/security/app-image.tar
            candidate/dist/security/scan-subject.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove transient image archive
        if: always()
        run: rm -f dist/security/app-image.tar

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-analysis-${{ github.run_id }}
          path: candidate/dist/security
          if-no-files-found: error
          retention-days: 30
