name: V1.2 Sprint 6 Validation

on:
  push:
    branches:
      - feature/v1.2-sprint6-release-readiness

permissions:
  contents: read

concurrency:
  group: v12-sprint6-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  full-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-audit.txt
      - name: Dependency integrity and vulnerability audit
        run: |
          pip check
          cat requirements.txt requirements-postgres.txt requirements-browser.txt > /tmp/v12-requirements.txt
          pip-audit -r /tmp/v12-requirements.txt --progress-spinner off
      - name: Backend tests
        run: pytest -q
      - name: Export OpenAPI contract
        run: python scripts/export_openapi.py
      - name: Static and security checks
        run: |
          python scripts/check_js.py
          python scripts/secret_scan.py
          python -m compileall -q apps scripts migrations
          git diff --check
      - name: SQLite migration cycle
        env:
          DATABASE_URL: sqlite:///./dist/v12-migration-smoke.db
        run: |
          mkdir -p dist
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade 0001_initial
          python -m alembic -c alembic.ini upgrade head
      - name: Upload OpenAPI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-sprint6-openapi-${{ github.run_id }}
          path: docs/api/openapi.json
          if-no-files-found: error

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_ci
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://zhongshu:ci-postgres-password@127.0.0.1:5432/zhongshu_ci
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: ci-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: ci-phone-fingerprint-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: Create V1.0.1 baseline
        run: |
          mkdir -p dist
          python -m alembic -c alembic.ini upgrade 0001_initial
          python scripts/seed_v101_migration_fixture.py
          python scripts/baseline_v101.py --output dist/v101-baseline.json
      - name: Upgrade, preview, backfill and reconcile
        run: |
          python -m alembic -c alembic.ini upgrade head
          python scripts/migrate_v12_data.py --dry-run --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/migrate_v12_data.py --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/verify_v12_postgres_migration.py > dist/v12-postgres-verification.json
      - name: Downgrade and clean re-upgrade
        run: |
          python -m alembic -c alembic.ini downgrade 0001_initial
          python -m alembic -c alembic.ini upgrade head
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-sprint6-postgres-${{ github.run_id }}
          path: |
            dist/v101-baseline.json
            dist/v12-postgres-verification.json
          if-no-files-found: warn

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./dist/v12-browser-smoke.db
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and Chromium
        run: |
          pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Initialize browser database
        run: |
          mkdir -p dist/browser-smoke
          python scripts/init_db.py
          python scripts/seed_demo.py
      - name: Start API and run browser smoke
        run: |
          uvicorn apps.api.src.main:app --host 127.0.0.1 --port 8000 > dist/browser-smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/ready
          python scripts/browser_smoke_v12.py --output-dir dist/browser-smoke
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-sprint6-browser-${{ github.run_id }}
          path: dist/browser-smoke
          if-no-files-found: error
