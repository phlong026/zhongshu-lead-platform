name: Finalize Invite Completion

on:
  push:
    branches: [feat/invite-binding-complete]
    paths:
      - .github/workflows/_agent-invite-finalize-20260822.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: one-shot-invite-completion
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_invite_final
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: invite-final-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_invite_final"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INVITE_POSTGRES_TEST_URL: postgresql+psycopg://zhongshu:invite-final-password@127.0.0.1:5432/zhongshu_invite_final
      FIELD_ENCRYPTION_KEY: invite-final-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: invite-final-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: invite-final-phone-fingerprint-secret-at-least-32-characters
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feat/invite-binding-complete
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install all verification dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-audit.txt -r requirements-browser.txt

      - name: Apply any missing full invite patch
        run: |
          if [ -f scripts/_agent_invite_completion_20260822.py ]; then
            python scripts/_agent_invite_completion_20260822.py
          fi

      - name: Enforce PostgreSQL-safe primary user ordering
        run: |
          if [ -f scripts/_agent_invite_pg_fk_fix_20260822.py ]; then
            python scripts/_agent_invite_pg_fk_fix_20260822.py
          else
            python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/services/invite_binding_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''    user_id = uuid_str()
              occupied = db.execute(
          '''
          new = '''    user_id = uuid_str()
              # PostgreSQL enforces this foreign key immediately; the candidate
              # remains inside the same transaction and is rolled back on conflict.
              user = User(
                  id=user_id,
                  display_name=nickname or company.owner_name or "微信加盟商",
                  company_id=company.id,
                  status="ACTIVE",
                  last_login_at=utcnow(),
              )
              db.add(user)
              db.flush()

              occupied = db.execute(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          duplicate = '''    if company.primary_user_id != user_id:
                  raise AppError("AUTH_COMPANY_BIND_CONFLICT", "公司主账号占用结果异常", 409)

              user = User(
                  id=user_id,
                  display_name=nickname or company.owner_name or "微信加盟商",
                  company_id=company.id,
                  status="ACTIVE",
                  last_login_at=utcnow(),
              )
              db.add(user)
              db.flush()
              assign_role(db, user, "FRANCHISE_OWNER")
          '''
          replacement = '''    if company.primary_user_id != user_id:
                  raise AppError("AUTH_COMPANY_BIND_CONFLICT", "公司主账号占用结果异常", 409)

              assign_role(db, user, "FRANCHISE_OWNER")
          '''
          if duplicate in text:
              text = text.replace(duplicate, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          fi

      - name: Static and targeted regression gates
        run: |
          node --check apps/h5/app.js
          node --check apps/admin/app.js
          python -m pytest -q \
            apps/api/tests/test_auth_company.py \
            apps/api/tests/test_invite_binding_security.py \
            apps/api/tests/test_invite_preview.py \
            apps/api/tests/test_wechat_oauth.py \
            apps/api/tests/test_test_environment_isolation.py \
            apps/api/tests/test_claim_singleflight.py \
            apps/api/tests/test_claim_replay_coalescing.py \
            apps/api/tests/test_invite_frontend_contract.py

      - name: PostgreSQL migration and invitation concurrency gates
        env:
          DATABASE_URL: ${{ env.INVITE_POSTGRES_TEST_URL }}
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m pytest apps/api/tests/test_invite_postgres_concurrency.py -q

      - name: Real Chromium smoke for admin and H5
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest apps/api/tests/test_invite_browser_smoke.py -q

      - name: Full test coverage and security gates
        run: |
          mkdir -p dist/coverage
          python -m pytest \
            --cov=apps.api.src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:dist/coverage/coverage.json \
            --cov-fail-under=74
          python scripts/check_coverage_gate.py --coverage dist/coverage/coverage.json --output dist/coverage/critical-coverage.json
          python scripts/check_js.py
          python scripts/secret_scan.py
          python -m compileall -q apps scripts migrations
          git diff --check

      - name: Remove all temporary execution assets
        run: |
          rm -f scripts/_agent_invite_completion_20260822.py
          rm -f scripts/_agent_invite_pg_fk_fix_20260822.py
          rm -f .github/workflows/_agent-invite-completion-20260822.yml
          rm -f .github/workflows/_agent-invite-pg-fk-fix-20260822.yml
          rm -f .github/workflows/_agent-invite-finalize-20260822.yml
          rm -f .github/workflows/pr-source-snapshot.yml

      - name: Commit fully verified feature result
        run: |
          git config user.name "荣赫智能"
          git config user.email "peihr66@gmail.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "完成邀请绑定全链路与发布门禁

统一完成测试隔离、S01 并发收口、专属邀请确认、后台复制二维码、H5 微信确认门禁、邀请管理、匹配发送适配、PostgreSQL 并发、Chromium smoke 和安全回归。

Constraint: 不提交生产秘密；不以 mock、SQLite 或健康检查冒充生产验证
Confidence: high
Scope-risk: medium
Reversibility: clean
Tested: 全量 pytest+coverage、PostgreSQL 16 并发、Chromium、JS、秘密扫描、编译
Not-tested: 真实微信 WebView、生产配置、外部发送凭据、全角色 UAT"
            git push origin HEAD:feat/invite-binding-complete
          fi

      - name: Dispatch formal main release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main-release.yml --ref feat/invite-binding-complete -f performance_action=none
