name: V1.2 Feature Branch CI

on:
  push:
    branches:
      - "feature/v1.2-*"
    paths:
      - "apps/**"
      - "scripts/**"
      - "migrations/**"
      - "tests/**"
      - "*.py"
      - "requirements*.txt"
      - "alembic.ini"
      - ".github/workflows/v12-feature-ci.yml"

permissions:
  contents: read

concurrency:
  group: v12-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Run JavaScript checks
        run: python scripts/check_js.py

      - name: Scan repository secrets
        run: python scripts/secret_scan.py

      - name: Compile Python sources
        run: python -m compileall -q apps scripts migrations

      - name: Check patch whitespace
        run: git diff --check
