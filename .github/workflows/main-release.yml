name: Main Release Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-audit.txt

      - name: Verify installed dependencies
        run: pip check

      - name: Validate temporary dependency waiver expiry
        run: python scripts/check_dependency_waiver.py

      - name: Audit Python dependencies
        shell: bash
        run: |
          {
            cat requirements.txt
            printf '\n'
            cat requirements-postgres.txt
            printf '\n'
            cat requirements-browser.txt
            printf '\n'
          } > /tmp/main-release-requirements.txt
          pip-audit -r /tmp/main-release-requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-3552

      - name: Run backend tests with coverage gate
        shell: bash
        run: |
          mkdir -p dist/coverage
          pytest \
            --cov=apps.api.src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:dist/coverage/coverage.xml \
            --cov-report=json:dist/coverage/coverage.json \
            --cov-fail-under=75

      - name: Summarize critical coverage
        if: always()
        run: python scripts/check_coverage_gate.py --coverage dist/coverage/coverage.json --output dist/coverage/critical-coverage.json

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-coverage-${{ github.run_id }}
          path: dist/coverage
          if-no-files-found: error
          retention-days: 30

      - name: Generate current OpenAPI contract
        run: python scripts/export_openapi.py --output dist/openapi/openapi.json

      - name: Run JavaScript checks
        run: python scripts/check_js.py

      - name: Scan repository secrets
        run: python scripts/secret_scan.py

      - name: Compile Python sources
        run: python -m compileall -q apps scripts migrations

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify release metadata and main workflow contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest_path = Path("RELEASE_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          release = str(manifest.get("release") or "")
          assert re.fullmatch(r"V\d+\.\d+\.\d+", release), release

          expected_branch = f"release/v{release[1:]}"
          assert manifest.get("branch") == expected_branch, manifest.get("branch")
          assert manifest.get("dirty_worktree") is False

          release_notes = Path("docs/release") / f"RELEASE_NOTES_{release}.md"
          assert release_notes.is_file(), release_notes

          legacy_workflow = Path(".github/workflows/v101-release.yml")
          assert not legacy_workflow.exists(), "legacy V1.0.1 main packaging workflow must remain retired"

          print(f"main release metadata verified: {release} from {expected_branch}")
          PY

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhongshu_ci
          POSTGRES_USER: zhongshu
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongshu -d zhongshu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://zhongshu:ci-postgres-password@127.0.0.1:5432/zhongshu_ci
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-at-least-32-characters
      PHONE_HASH_SECRET: ci-phone-hash-secret-at-least-24
      PHONE_FINGERPRINT_SECRET: ci-phone-fingerprint-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install migration dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Create V1.0.1 PostgreSQL baseline
        run: |
          mkdir -p dist
          python -m alembic -c alembic.ini upgrade 0001_initial
          python scripts/seed_v101_migration_fixture.py

      - name: Upgrade PostgreSQL to current head and verify V1.2 data migration
        run: |
          python -m alembic -c alembic.ini upgrade head
          python scripts/migrate_v12_data.py --dry-run --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/migrate_v12_data.py --batch-size 50 --max-batches 10 --fail-on-row-error
          python scripts/verify_v12_postgres_migration.py > dist/v12-postgres-verification.json
          python -m json.tool dist/v12-postgres-verification.json >/dev/null

      - name: Verify PostgreSQL downgrade and clean re-upgrade
        run: |
          python -m alembic -c alembic.ini downgrade 0001_initial
          python -m alembic -c alembic.ini upgrade head
